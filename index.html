<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>
        <title>Form</title>
    </head>
    <body>
        <main>
            <div class="image-container"></div>
            <div class="form-container">
                <h1>Create an account</h1>
                <p class="login">Already have an account? <a href="" class="login-link">Log in</a>
                </p>
                <form novalidate>
                    <input type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autofocus>
                    <fieldset>
                        <input type="text"
                            id="country"
                            name="country"
                            placeholder="Country">
                        <input type="number"
                            id="postal-code"
                            name="postal-code"
                            placeholder="Postal Code">
                    </fieldset>
                    <input type="password"
                        id="password"
                        name="password"
                        placeholder="Password">
                    <input type="password"
                        id="password-conf"
                        name="password-conf"
                        placeholder="Confirm Password">
                </form>
            </div>
        </main>
    </body>
</html>
