<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>
        <title>Form</title>
    </head>
    <body>
        <main>
            <div class="image-container"></div>
            <div class="form-container">
                <h1>Create an account</h1>
                <p class="login">Already have an account? <a href="" class="login-link">Log in</a>
                </p>
                <form novalidate>
                    <div class="form-group">
                        <input type="email"
                            id="email"
                            name="email"
                            placeholder="Email"
                            required
                            autofocus>
                        <span class="error-message"></span>
                    </div>
                    <fieldset>
                        <div class="form-group">
                            <input type="text"
                                id="country"
                                name="country"
                                placeholder="Country"
                                required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <input type="number"
                                id="postal-code"
                                name="postal-code"
                                placeholder="Postal Code"
                                required>
                            <span class="error-message"></span>
                        </div>
                    </fieldset>
                    <div class="form-group">
                        <input type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required>
                        <span class="error-message"></span>
                    </div>
                    <div class="form-group">
                        <input type="password"
                            id="password-conf"
                            name="password-conf"
                            placeholder="Confirm Password"
                            required>
                        <span class="error-message"></span>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </main>
    </body>
</html>
